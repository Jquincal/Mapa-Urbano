name: Error
description: Registrar un defecto reproducible
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Observar...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options:
        - Baja
        - Media
        - Alta
        - Bloqueante
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno y evidencia
      description: Versión, dispositivo/navegador y capturas sin datos sensibles.
