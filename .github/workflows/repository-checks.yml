name: Repository checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test backend and PostgreSQL/PostGIS migrations
        working-directory: backend-ktor
        run: ./gradlew --no-daemon check

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend-ktor/build/reports/tests/

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Markdown links
        run: python3 scripts/check_docs.py

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'

      - name: Reject versioned PDF files
        run: |
          if git ls-files '*.pdf' | grep -q .; then
            echo 'PDF files must remain outside Git; publish Markdown and images instead.'
            exit 1
          fi
